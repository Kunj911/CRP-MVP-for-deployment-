<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Live-Trace | Fittree International LLP{% endblock %}</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7fafc;
            color: #2d3748;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.04);
            border: 1px solid #edf2f7;
        }
        .header {
            background: linear-gradient(135deg, #3A6B4A, #2C5238);
            padding: 40px 30px;
            text-align: center;
            color: #ffffff;
        }
        .header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .header p {
            margin: 8px 0 0 0;
            color: #d3ebd9;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .content {
            padding: 40px 30px;
            line-height: 1.7;
            font-size: 16px;
        }
        .content h2 {
            margin-top: 0;
            font-size: 20px;
            color: #1a202c;
            font-weight: 600;
        }
        .content p {
            margin: 0 0 20px 0;
            color: #4a5568;
        }
        .info-card {
            background-color: #fcfcf9;
            border-left: 4px solid #3A6B4A;
            padding: 20px;
            border-radius: 0 8px 8px 0;
            margin: 25px 0;
            border-top: 1px solid #edf2f7;
            border-right: 1px solid #edf2f7;
            border-bottom: 1px solid #edf2f7;
        }
        .info-card p {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #4a5568;
        }
        .info-card p:last-child {
            margin: 0;
        }
        .info-card strong {
            color: #2d3748;
        }
        .button-container {
            text-align: center;
            margin: 35px 0 20px 0;
        }
        .button {
            display: inline-block;
            padding: 14px 32px;
            background-color: #3A6B4A;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 6px rgba(58, 107, 74, 0.15);
            transition: background-color 0.2s;
        }
        .button:hover {
            background-color: #2c5238;
        }
        .footer {
            background-color: #fafafa;
            padding: 25px 30px;
            text-align: center;
            font-size: 13px;
            color: #718096;
            border-top: 1px solid #edf2f7;
            line-height: 1.5;
        }
        .footer a {
            color: #3A6B4A;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Live-Trace</h1>
            <p>{% block subtitle %}by Fittree International LLP{% endblock %}</p>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            &copy; 2026 Fittree International LLP. All rights reserved.<br>
            Powered by Live-Trace
        </div>
    </div>
</body>
</html>
